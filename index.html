    <style>
      @keyframes bootPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      #boot-shell {
        height: 100vh;
        height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f8fafc;
      }
      #boot-header {
        flex-shrink: 0;
        width: 100%;
        height: 56px;
        background: #ffffff;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        box-sizing: border-box;
      }
      #boot-body {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        background: #f8fafc;
      }
      #boot-hero {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #e2e8f0;
        border-bottom: 4px solid #e2e8f0;
        animation: bootPulse 1.6s ease-in-out infinite;
      }
      #boot-search {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translate(-50%, 50%);
        width: calc(100% - 32px);
        max-width: 56rem;
        height: 56px;
        background: #ffffff;
        border-radius: 1.5rem;
        border: 1px solid #f1f5f9;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        z-index: 10;
      }
      #boot-quick {
        max-width: 80rem;
        margin: 0 auto;
        padding: 48px 16px 32px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .boot-quick-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .boot-quick-box {
        width: 64px;
        height: 64px;
        border-radius: 1rem;
        background: #ffffff;
        border: 1px solid #f1f5f9;
        animation: bootPulse 1.6s ease-in-out infinite;
      }
      .boot-quick-line {
        width: 48px;
        height: 10px;
        border-radius: 9999px;
        background: #e2e8f0;
      }
      #boot-promo {
        max-width: 85rem;
        margin: 0 auto;
        padding: 0 16px;
      }
      #boot-promo-box {
        height: 224px;
        border-radius: 1rem;
        background: rgba(37, 99, 235, 0.12);
        border: 1px solid rgba(191, 219, 254, 0.7);
        animation: bootPulse 1.6s ease-in-out infinite;
      }
      #boot-bottom-nav {
        position: relative;
        flex-shrink: 0;
        width: 100%;
        height: 72px;
        background: #ffffff;
        border-top: 1px solid #f1f5f9;
        border-top-left-radius: 1.5rem;
        border-top-right-radius: 1.5rem;
        box-shadow: 0 -10px 30px -10px rgba(0, 0, 0, 0.1);
      }
      #boot-fab {
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(-50%);
        width: 56px;
        height: 56px;
        border-radius: 9999px;
        background: #2563eb;
      }
      @media (min-width: 768px) {
        #boot-header {
          height: 65px;
          border-radius: 0;
          box-shadow: none;
          padding: 0 32px;
        }
        #boot-hero {
          aspect-ratio: 21 / 9;
        }
        #boot-search {
          height: 64px;
          border-radius: 9999px;
        }
        #boot-quick {
          padding: 64px 32px 40px;
          display: flex;
          justify-content: center;
          gap: 40px;
        }
        .boot-quick-box {
          width: 96px;
          height: 96px;
          border-radius: 20px;
        }
        #boot-promo {
          padding: 0 32px;
        }
        #boot-promo-box {
          height: 192px;
          border-radius: 2rem;
        }
        #boot-bottom-nav {
          display: none;
        }
      }
    </style>
